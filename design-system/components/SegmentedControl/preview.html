<!doctype html>
<html>
<head><meta charset="utf-8"><title>SegmentedControl — preview</title>

<body>
<div id="root"></div>
<script>
  var G = window.Autique, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h(G.SegmentedControl, { label: '구성품 여부', options: ['전체 있음', '일부 있음', '구성품 없음'], defaultValue: '일부 있음' }),
      h(G.SegmentedControl, { options: ['전체 있음', '일부 있음', '구성품 없음'], disabledOptions: ['구성품 없음'] })));
</script>
</body>
</html>
