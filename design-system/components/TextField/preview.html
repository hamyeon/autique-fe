<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField — preview</title>
<style>body{margin:0;background:var(--white0)} #root{display:flex;flex-direction:column;gap:16px;padding:16px 20px;max-width:375px}</style></head>
<body>
<div id="root"></div>
<script>
  var G = window.Autique, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(G.TextField, { label: '브랜드', defaultValue: '나이키' }),
    h(G.TextField, { label: '모델명', placeholder: '모델명을 입력해주세요' }),
    h(G.TextField, { label: '사이즈', defaultValue: '240', disabled: true }),
    h(G.TextField, { label: '브랜드', placeholder: '브랜드를 입력해주세요', error: '브랜드를 입력해 주세요.' })));
</script>
</body>
</html>
