<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon — preview</title>
<style>body{margin:0;background:var(--white0)} #root{padding:16px;max-width:375px;display:flex;flex-direction:column;gap:16px}</style></head>
<body>
<div id="root"></div>
<script>
  var G = window.Autique, h = React.createElement;
  var names = [['Add',24],['Add',20],['Minus',24],['Minus',20],['Info',24],['Info',18],['Search',24],['Bell',24],['Bag',24],['ArrowLeft',36],['ArrowRight',16],['ArrowRight',36],['ArrowUp',20],['ArrowDown',16],['ArrowDown',20]];
  var cell = function (el, cap, k) { return h('div', { key: k, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, width: 64 } }, el, h('span', { className: 'label02', style: { color: 'var(--gray5)' } }, cap)); };
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } },
      names.map(function (n, i) { return cell(h(G.Icon, { name: n[0], size: n[1] }), n[0] + ' ' + n[1], i); }),
      cell(h(G.Icon, { name: 'Favorite', style: 'line' }), 'Favorite line', 'fl'),
      cell(h(G.Icon, { name: 'Favorite', style: 'fill', color: 'error1' }), 'Favorite fill', 'ff'),
      ['Home','Product','User'].map(function (n) { return [cell(h(G.Icon, { name: n }), n, n), cell(h(G.Icon, { name: n, state: 'active' }), n + ' active', n + 'a')]; })));
</script>
</body>
</html>
