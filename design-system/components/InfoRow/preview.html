<!doctype html>
<html>
<head><meta charset="utf-8"><title>InfoRow — preview</title>
<style>body{margin:0;background:var(--white0)} #root{padding:16px 20px;max-width:375px;display:flex;flex-direction:column;gap:16px}</style></head>
<body>
<div id="root"></div>
<script>
  var G = window.Autique, h = React.createElement;
  var rows = [['경매 시작','오늘 오후 8시','regular'],['시작가','50,000원','default'],['남은 시간','42:18','danger'],['결제할 금액','108,000원','total'],['AI 적정 시세','120,000원','hero']];
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    rows.map(function (r) { return h(G.InfoRow, { key: r[0], label: r[0], value: r[1], emphasis: r[2] }); })));
</script>
</body>
</html>
